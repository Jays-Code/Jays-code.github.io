<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Portfolio Game</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Import Map for direct browser loading (GitHub Pages) -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="css-container"></div>
    <div id="loading-screen">
        <div class="terminal-loader">
            <div class="text">SYSTEM INITIALIZATION...</div>
            <div class="text">LOADING ASSETS...</div>
            <div class="text">CALIBRATING THRUSTERS...</div>
            <div class="text">ESTABLISHING UPLINK...</div>
            <div class="text last">READY</div>
        </div>
    </div>
    <div id="ui">

        <div id="hud">
            <h1>Jays-Code</h1>
            <p>WASD to Move | Mouse to Look</p>
            <div id="debug-info">Speed: 0 | Pos: 0, 0, 0</div>
        </div>
        <div id="warning-msg">⚠ MISSILE INCOMING ⚠</div>
        <div id="interaction-prompt"></div>
        <div id="landing-prompt">PRESS SPACE TO LAND</div>
        <div id="spectator-mode">Viewing Terminal</div>

        <div id="target-box"></div>
        <div id="cinematic-overlay"></div>

        <!-- Mobile UI -->
        <canvas id="touch-canvas"></canvas>
        <div id="touch-controls-ui">
            <div id="vertical-controls">
                <button id="btn-up" class="touch-btn sm">▲</button>
                <button id="btn-down" class="touch-btn sm">▼</button>
            </div>
            <button id="btn-warp" class="touch-btn">WARP</button>
        </div>

    </div>
    <script type="module" src="./js/main.js"></script>
</body>

</html>
